[project]
name = "h2d-api"
version = "0.1.0"
description = "API do H2D - TI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.32,<0.33",
    "fastapi>=0.162,<0.163",
    "pydantic-settings>=2.16,<3",
    "pyjwt>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uuid-utils>=1.2,<2",
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pip-audit>=2.9",
    "pyright>=1.1.414",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "h2d"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
