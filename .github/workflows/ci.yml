name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: h2d
          POSTGRES_PASSWORD: somente-ci
          POSTGRES_DB: h2d_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U h2d -d h2d_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://h2d:somente-ci@localhost:5432/h2d_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    name: Contrato da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Gerar contrato e cliente
        run: |
          (cd apps/api && uv sync --frozen --python 3.12 && uv run python -m h2d.export_openapi openapi.json)
          (cd apps/web && npm ci && npm run gen:api)
      - name: Falhar se algo não foi commitado
        run: |
          if ! git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.d.ts; then
            echo "::error::Contrato desatualizado. Rode os comandos de contrato do README e commite o resultado."
            exit 1
          fi

  security:
    name: Segurança
    runs-on: ubuntu-latest
    # Em pull request o gitleaks lista os commits pela API do GitHub. Sem pull-requests: read ela
    # responde 403 e o job quebra antes de escanear qualquer coisa.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: pip-audit
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          target: prod
          load: true
          tags: h2d-api:ci
      - name: Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          load: true
          tags: h2d-web:ci
      # Falha só com problemas graves que já têm correção; exceções ficam em .trivyignore.
      - name: Trivy na API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: h2d-api:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Trivy na web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: h2d-web:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
